name: Bundle size

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read # checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  size-limit:
    # Fails when a budget in .size-limit.json is exceeded.
    name: size-limit
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Use Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm ci:install
      - name: Build
        run: pnpm turbo run build --filter=@glion/profiles
      - name: Check size limits
        run: pnpm size

  compressed-size:
    # Comments the compressed size of each @glion/profiles file against the
    # base branch.
    name: compressed-size
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      pull-requests: write # the size comment

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Use Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: "pnpm"
      - uses: preactjs/compressed-size-action@f322c295dde06a1cb7ccaef105732dd8a726d1d9 # 2.10.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          install-script: pnpm ci:install
          build-script: build
          compression: brotli
          pattern: "packages/profiles/dist/**/*.js"
