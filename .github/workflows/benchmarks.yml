name: Benchmarks

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmarks:
    name: Benchmarks (CodSpeed)
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      pull-requests: write # CodSpeed posts its report as a PR comment
      id-token: write # CodSpeed authenticates the upload with OIDC

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm ci:install

      - name: Build packages
        run: pnpm build

      - name: Run benchmarks
        uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
        with:
          mode: simulation
          run: pnpm bench:ci
