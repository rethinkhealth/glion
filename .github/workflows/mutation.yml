name: Mutation testing

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # Weekly full run, Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: ${{ github.event_name == 'pull_request' && 'Mutation testing (changed packages)' || 'Mutation testing (all packages)' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # turbo's `[origin/main]` filter needs the base ref.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm ci:install
      - name: Build
        run: pnpm build
      - name: Mutate changed packages
        if: github.event_name == 'pull_request'
        run: pnpm mutate:changed
      - name: Mutate all packages
        if: github.event_name != 'pull_request'
        run: pnpm mutate
      - name: Summarize scores
        if: always()
        run: node scripts/mutation-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-reports
          path: packages/*/reports/stryker.json
          if-no-files-found: ignore
