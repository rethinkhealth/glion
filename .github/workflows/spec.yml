name: Spec

on:
  push:
    branches: ["main"]
    paths:
      - "spec/**"
      - ".github/workflows/spec.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "spec/**"
      - ".github/workflows/spec.yml"

permissions:
  contents: read # checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lean:
    name: Lean specification
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          # The Lake project lives in spec/, not at the repository root.
          lake-package-directory: spec
          # Run only the steps listed below, rather than the ones lean-action
          # would infer from the lakefile.
          auto-config: false
          # `lake build`: checks every proof, and through `Statements.lean`
          # fails when a headline statement, its axioms, or the rule names
          # change.
          build: true
          # Replays every declaration of these modules through the Lean kernel
          # again, from the built files, independently of the build.
          leanchecker: true
          leanchecker-args: Hl7v2 Statements
          # Fails when any declaration in a module under `Hl7v2` depends on an
          # axiom outside this list: a `sorry` (`sorryAx`), a `native_decide`
          # (`Lean.ofReduceBool`), `Classical.choice`, or a new `axiom`.
          axiom-audit: true
          axiom-audit-allow: propext,Quot.sound
          axiom-audit-root: Hl7v2
