name: zizmor

on:
  push:
    branches:
      - "**"
      # changesets/action commits through the GitHub API on this scratch
      # branch and deletes it seconds later, before the SARIF upload runs.
      - "!changesets-ghcommit-temp/**"
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: Workflow security (zizmor)
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      security-events: write # upload SARIF; the main ruleset blocks merges on the resulting alerts

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          persona: pedantic
