name: Changesets
on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  CI: true

jobs:
  select-mode:
    name: Select Changesets mode
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm ci:install

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Version pull request
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read # checkout
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write # push the version branch
          permission-pull-requests: write # open or update the version pull request

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm ci:install

      - name: Open or update the version pull request
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm ci:version
          commit-message: "chore: update versions"
          pr-title: "chore: update versions"
          github-token: ${{ steps.app-token.outputs.token }}

  pack:
    name: Pack
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm ci:install

      - name: Build all packages
        run: pnpm build

      - name: Pack publishable packages
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish
    needs: pack
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write # push release tags and create the GitHub release
      id-token: write # npm trusted publishing with provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm ci:install

      - name: Publish to npm and push git tags
        id: publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: false

      - name: Create the GitHub release
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_PACKAGES: ${{ steps.publish.outputs.published-packages }}
        run: |
          version="$(jq -r '.[0].version' <<< "$PUBLISHED_PACKAGES")"
          pnpm --silent release:notes "$version" > "$RUNNER_TEMP/release-notes.md"
          prerelease=()
          if [[ "$version" == *-* ]]; then
            prerelease=(--prerelease --latest=false)
          fi
          gh release create "v$version" \
            --title "v$version" \
            --target "$GITHUB_SHA" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${prerelease[@]}"
